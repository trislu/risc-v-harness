name: vsix

# A VSIX that carries a binary is per platform and architecture: the manifest
# records `TargetPlatform`, and the archive must hold exactly one binary. The
# matrix therefore runs once per pair, on a runner of that pair.
#
# Tags build the whole matrix; pull requests do not, because it is expensive and
# the Rust jobs already gate the binary itself.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          # One macOS runner builds both triples: the SDK links either
          # architecture. `macos-14` is no longer an image — jobs on it are
          # cancelled without ever being assigned a runner.
          - target: darwin-x64
            runner: macos-latest
            triple: x86_64-apple-darwin
          - target: darwin-arm64
            runner: macos-latest
            triple: aarch64-apple-darwin
          - target: win32-x64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
          - target: win32-arm64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cargo build -p rvh-cli --release --target ${{ matrix.triple }}

      # The script stages the binary, writes the ignore file that keeps other
      # targets out, and runs vsce.
      - name: Package
        shell: bash
        run: |
          binary="target/${{ matrix.triple }}/release/rvh"
          case "${{ matrix.target }}" in
            win32-*) binary="$binary.exe" ;;
          esac
          cargo xtask package-vsix "${{ matrix.target }}" --binary "$binary"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: target/vsix/*.vsix
          if-no-files-found: error

  # One job per target. A Marketplace hiccup on one package then cannot leave the
  # other five unpublished, and a retry re-runs only the package that failed.
  # Publishing them together would be equivalent when the service behaves.
  publish:
    name: publish ${{ matrix.target }}
    needs: package
    # A dispatch of a branch build must not publish; only a tag release does.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      # Each target is independent; one failure must not cancel the rest.
      fail-fast: false
      matrix:
        target:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - win32-x64
          - win32-arm64
    # Trusted Publishing: the job exchanges this OIDC token for a short-lived
    # Marketplace credential, so no personal access token is stored.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: artifact

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --oidc needs vsce 4.1 or newer.
      #
      # Azure DevOps, which serves the Marketplace, answers with an HTML error
      # page often enough that one attempt is not a release. The target is
      # idempotent — `--skip-duplicate` skips a package already published — so a
      # retry resumes instead of failing again on the same conflict.
      - name: Publish ${{ matrix.target }}
        run: |
          shopt -s nullglob
          packages=(artifact/*.vsix)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "no VSIX in the vsix-${{ matrix.target }} artifact" >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "attempt $attempt: publishing ${{ matrix.target }} as $GITHUB_REF_NAME"
            if npx --yes @vscode/vsce@latest publish \
                 --oidc --skip-duplicate --packagePath "${packages[@]}"; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          exit 1
