name: vsix

# A VSIX that carries a binary is per platform and architecture: the manifest
# records `TargetPlatform`, and the archive must hold exactly one binary. The
# matrix therefore runs once per pair, on a runner of that pair.
#
# Tags build the whole matrix; pull requests do not, because it is expensive and
# the Rust jobs already gate the binary itself.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          # One macOS runner builds both triples: the SDK links either
          # architecture. `macos-14` is no longer an image — jobs on it are
          # cancelled without ever being assigned a runner.
          - target: darwin-x64
            runner: macos-latest
            triple: x86_64-apple-darwin
          - target: darwin-arm64
            runner: macos-latest
            triple: aarch64-apple-darwin
          - target: win32-x64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
          - target: win32-arm64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cargo build -p rvh-cli --release --target ${{ matrix.triple }}

      # The script stages the binary, writes the ignore file that keeps other
      # targets out, and runs vsce.
      - name: Package
        shell: bash
        run: |
          binary="target/${{ matrix.triple }}/release/rvh"
          case "${{ matrix.target }}" in
            win32-*) binary="$binary.exe" ;;
          esac
          cargo xtask package-vsix "${{ matrix.target }}" --binary "$binary"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: target/vsix/*.vsix
          if-no-files-found: error

  # One publish call for all six packages: each manifest already records
  # TargetPlatform, so vsce attaches them to the same version and the
  # Marketplace serves whichever matches the client.
  publish:
    name: publish
    needs: package
    # A dispatch of a branch build must not publish; only a tag release does.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted Publishing: the job exchanges this OIDC token for a short-lived
    # Marketplace credential, so no personal access token is stored.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vsix-*

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --oidc and variadic --packagePath need vsce 4.1 or newer.
      - name: Publish
        run: |
          shopt -s nullglob
          packages=(artifacts/vsix-*/*.vsix)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "no VSIX to publish" >&2
            exit 1
          fi
          echo "publishing ${#packages[@]} package(s) as $GITHUB_REF_NAME"
          npx --yes @vscode/vsce@latest publish \
            --oidc --skip-duplicate --packagePath "${packages[@]}"
