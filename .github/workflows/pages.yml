name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer commit replaces an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build the wasm core
        run: |
          mkdir -p web/public
          cargo build -p rvh-wasm --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/rvh_wasm.wasm web/public/rvh_wasm.wasm
      - name: Install and check the web app
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web run check
      - name: Build for the project page
        env:
          RVH_BASE: /${{ github.event.repository.name }}/
        run: pnpm --dir web run build
      # The smoke test serves the built site, so it runs after the build.
      - name: Drive the TS wrapper against the built artifact
        run: pnpm --dir web run smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
