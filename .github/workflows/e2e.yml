name: e2e

# The browser suite is the only check that catches "the page is broken while
# every unit passes": the wasm loading, the editor wiring, the fix buttons. It is
# also the most expensive job, so it runs when something it covers changed, not on
# a documentation edit.
on:
  push:
    paths:
      - 'web/**'
      - 'crates/**'
      - 'xtask/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'crates/**'
      - 'xtask/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Browsers change only when Playwright does, so the download is cacheable
      # while the system packages still come from `--with-deps`.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web run check
      - run: pnpm --dir editors/vscode run check
      - run: pnpm --dir editors/vscode run build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/test-results
            assets/playground.png
          if-no-files-found: ignore
