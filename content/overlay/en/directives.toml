# One line per directive this assembler implements.

".text" = "switch to the text section"
".data" = "switch to the data section"
".rodata" = "switch to the read-only data section"
".section" = "switch to the named section"
".globl" = "mark a symbol as globally visible"
".global" = "mark a symbol as globally visible"
".align" = "pad to a power-of-two boundary"
".p2align" = "pad to a power-of-two boundary"
".byte" = "emit bytes"
".half" = "emit 16-bit words"
".word" = "emit 32-bit words"
".dword" = "emit 64-bit words"
".string" = "emit a NUL-terminated string"
".asciz" = "emit a NUL-terminated string"
".equ" = "define a constant"
".set" = "define a constant"
".zero" = "emit N zero bytes"
".space" = "emit N zero bytes"
".option" = "change the target from this line on, as in `.option arch, +m`"
".attribute" = "declare a file attribute, as in `.attribute arch, \"rv32i2p1_m2p0\"`"
