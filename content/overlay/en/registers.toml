# Role of each register, indexed by number, from the psABI.

"0" = "constant zero; writes are ignored"
"1" = "return address"
"2" = "stack pointer"
"3" = "global pointer"
"4" = "thread pointer"
"5" = "temporary"
"6" = "temporary"
"7" = "temporary"
"8" = "saved register, also the frame pointer"
"9" = "saved register"
"10" = "argument and return value"
"11" = "argument and return value"
"12" = "argument"
"13" = "argument"
"14" = "argument"
"15" = "argument"
"16" = "argument"
"17" = "argument"
"18" = "saved register"
"19" = "saved register"
"20" = "saved register"
"21" = "saved register"
"22" = "saved register"
"23" = "saved register"
"24" = "saved register"
"25" = "saved register"
"26" = "saved register"
"27" = "saved register"
"28" = "temporary"
"29" = "temporary"
"30" = "temporary"
"31" = "temporary"
