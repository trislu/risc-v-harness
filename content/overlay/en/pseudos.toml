# One line per pseudo-instruction, shown on hover.
# Keys are the mnemonic; values are Markdown.

beqz = "branch if equal to zero: `beq rs, x0, target`"
bnez = "branch if not zero: `bne rs, x0, target`"
blez = "branch if <= 0: `bge x0, rs, target`"
bgez = "branch if >= 0: `bge rs, x0, target`"
bltz = "branch if < 0: `blt rs, x0, target`"
bgtz = "branch if > 0: `blt x0, rs, target`"
ble = "branch if <=: a swapped `bge`"
bge = "branch if >=: `bge`"
bleu = "unsigned branch if <=: a swapped `bgeu`"
bgeu = "unsigned branch if >=: `bgeu`"
blt = "branch if <: `blt`"
bgt = "branch if >: a swapped `blt`"
bltu = "unsigned branch if <: `bltu`"
bgtu = "unsigned branch if >: a swapped `bltu`"
j = "jump: `jal x0, target`"
jr = "jump to register: `jalr x0, rs, 0`"
ret = "return: `jalr x0, 0(ra)`"
nop = "no operation: `addi x0, x0, 0`"
mv = "move: `addi rd, rs, 0`"
not = "bitwise not: `xori rd, rs, -1`"
neg = "negate: `sub rd, x0, rs`"
seqz = "set if equal to zero: `sltiu rd, rs, 1`"
snez = "set if not zero: `sltu rd, x0, rs`"
li = "load immediate: `addi` when it fits, otherwise `lui` + `addi`"
la = "load address: an `auipc` + `addi` pair"
csrr = "read a CSR: `csrrs rd, csr, x0`"
csrw = "write a CSR: `csrrw x0, csr, rs`"
csrs = "set CSR bits: `csrrs x0, csr, rs`"
csrc = "clear CSR bits: `csrrc x0, csr, rs`"
