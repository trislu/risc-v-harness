# RV32I base integer instruction set.
#
# Schema (ADR-0003, architecture.md §2.1):
#   id        stable key; content keys are derived as insn.<id>.<field>
#   mnemonic  as written in source
#   ext       extension id (lowercase)
#   format    R | I | S | B | U | J
#   opcode    7-bit binary literal
#   funct3    3-bit binary literal, when the format has one
#   funct7    7-bit binary literal, when the instruction needs one
#   imm12     fixed 12-bit immediate field (system instructions only)
#   class     semantic class; drives explanation templates
#   operands  kind:bits[:signed][:align], with kinds
#             rd gpr, rs1 gpr, rs2 gpr, imm, shamt, csr, zimm, pred, succ
#
# Fields are binary literals so the bit pattern stays visible in review.
# Any other key is rejected by `cargo xtask codegen`.

[[insn]]
id = "add"
mnemonic = "add"
ext = "i"
format = "R"
opcode = 0b0110011
funct3 = 0b000
funct7 = 0b0000000
class = "alu-reg"
operands = ["rd:gpr", "rs1:gpr", "rs2:gpr"]

