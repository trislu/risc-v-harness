# RV32M: integer multiply and divide.
#
# Schema: see isa/rv32i.toml. All eight are R-format with opcode 0110011 and
# funct7 0000001; funct3 selects the operation.

[[insn]]
id = "mul"
mnemonic = "mul"
ext = "m"
format = "R"
opcode = 0b0110011
funct3 = 0b000
funct7 = 0b0000001
class = "mul-div"
operands = ["rd:gpr", "rs1:gpr", "rs2:gpr"]

