# RV32D: double precision. The registers are 64 bits wide, so a double needs no
# boxing; a single is stored in the low half with the upper half all ones.


[[insn]]
id = "fld"
mnemonic = "fld"
ext = "d"
format = "I"
opcode = 0b0000111
funct3 = 0b011
class = "load"
operands = ["frd:fr", "rs1:gpr", "imm:12:s"]

