# RV32A: atomics on word memory.
#
# All eleven use opcode 0101111 and funct3 010. The top seven bits are
# funct5 followed by the aq and rl ordering bits; the table holds the form
# without ordering, which is what an assembler emits for `amoadd.w`.

[[insn]]
id = "lr-w"
mnemonic = "lr.w"
ext = "a"
format = "R"
opcode = 0b0101111
funct3 = 0b010
funct7 = 0b0001000
class = "atomic"
operands = ["rd:gpr", "rs1:gpr"]

