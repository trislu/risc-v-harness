# RV32C: the compressed instructions, 16 bits wide (ADR-0018).
#
# A compressed instruction's `opcode` is its two-bit quadrant and every
# immediate is scrambled; the layouts live in `rvh-asm::encode_compressed` and in
# the simulator's decoder, next to the six 32-bit formats.

